<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Embedding test</title>
  <link rel="icon" href="icon.png">
  <style>
    :root { color-scheme: light dark; --bg: #f6f6f7; --card: #fff; --text: #17181b; --muted: #565a62; --line: #dcdde0; --accent: #3a7afe; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0f11; --card: #16171a; --text: #e7e8ea; --muted: #a3a6ad; --line: #2a2c31; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
    header b { font-weight: 600; margin-right: 6px; }
    input[type=url] { flex: 1; min-width: 220px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; outline: none; }
    input[type=url]:focus { border-color: var(--accent); }
    label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
    button { height: 32px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
    p { margin: 0; padding: 8px 14px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); }
    main { flex: 1; min-height: 0; padding: 14px; }
    iframe { display: block; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 8px; background: #000; }
  </style>
</head>
<body>
  <header>
    <b>Embedding test</b>
    <input id="src" type="url" spellcheck="false" aria-label="Address of the stream page">
    <label title="Like a site that puts the frame in a sandbox (some school and website builders do)"><input id="sandbox" type="checkbox"> Sandboxed frame</label>
    <button id="load" type="button">Load</button>
  </header>
  <p>This page counts as a different website from the stream page, just like your own site would. If you can sign in and see your screen below, embedding works.</p>
  <main><iframe id="frame" title="Stream" allow="fullscreen; autoplay; clipboard-read; clipboard-write; keyboard-map" allowfullscreen></iframe></main>
  <script src="embed-test.js"></script>
</body>
</html>
