<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Beam Remote</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="titlebar">
    <img src="../../assets/icon.png" alt="">
    <span id="tb-name">Beam Remote</span>
    <span class="tb-status" id="tb-status"></span>
  </header>
  <div class="shell">
    <aside class="side">
      <div class="side-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search settings" aria-label="Search settings" spellcheck="false" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </div>
      <nav class="side-nav" id="nav" aria-label="Sections"></nav>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
